spring.application.name=kongPortfolio
server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Opt in only after role permission and STG release review. No API key.
portfolio.bedrock.enabled=${BEDROCK_ENABLED:false}
portfolio.bedrock.max-output-tokens=${BEDROCK_MAX_OUTPUT_TOKENS:2048}
portfolio.bedrock.timeout-seconds=${BEDROCK_TIMEOUT_SECONDS:20}
# Empty bucket selects the bundled public summary for offline/local use.
# S3 reads require an immutable version and matching SHA-256; never store the resume here.
portfolio.bedrock.facts-bucket=${BEDROCK_FACTS_BUCKET:}
portfolio.bedrock.facts-version=${BEDROCK_FACTS_VERSION:}
portfolio.bedrock.facts-sha256=${BEDROCK_FACTS_SHA256:}
portfolio.bedrock.facts-owner=${BEDROCK_FACTS_OWNER:561798268037}
# Suppress SDK wire/signature logs even when the root logger is set to DEBUG.
logging.level.software.amazon.awssdk=WARN
logging.level.jdk.internal.net.http=WARN
