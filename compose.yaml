name: kongportfolio
services:
  backend:
    image: kongportfolio-backend:${PORTFOLIO_IMAGE_TAG:-local}
    build: ./backend
    volumes: ["backend-logs:/app/logs"]
    mem_limit: 512m
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  frontend:
    image: kongportfolio-frontend:${PORTFOLIO_IMAGE_TAG:-local}
    build: ./frontend
    ports: ["127.0.0.1:3000:8080"]
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
volumes:
  backend-logs:
