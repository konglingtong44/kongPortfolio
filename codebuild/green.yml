version: 0.2
env:
  shell: bash
  variables:
    CI: "true"
  exported-variables:
    - GREEN_RELEASE
    - BLUE_VERSION
    - GREEN_VERSION
phases:
  install:
    runtime-versions:
      nodejs: 24
  build:
    commands:
      - node scripts/verify-green.mjs
      - export GREEN_RELEASE=$(node -p "JSON.parse(require('fs').readFileSync('.local/green-verification/report.json')).releaseId")
      - export BLUE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('.local/green-verification/report.json')).blueVersion")
      - export GREEN_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('.local/green-verification/report.json')).greenVersion")
artifacts:
  base-directory: .local/green-verification
  files:
    - report.json
