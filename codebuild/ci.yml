# Prepared for AWS CodeBuild; no project or webhook is created by this file.
# Managed image: aws/codebuild/amazonlinux-x86_64-standard:5.0, privileged=false.
version: 0.2
env:
  shell: bash
  variables:
    CI_COMPONENT: all
phases:
  install:
    runtime-versions:
      nodejs: 24
      java: corretto21
  build:
    commands:
      - bash scripts/ci.sh "$CI_COMPONENT"
# Initial CI projects use NO_ARTIFACTS and no persistent cache. Generated
# verification bundles stay in the ephemeral workspace; release packaging
# and artifact storage belong to the later deployment pipeline.
